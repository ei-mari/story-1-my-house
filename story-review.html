        border-radius: 8px;
        background: #ffffff;
        box-shadow: var(--shadow);

        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      }

      .cover img:nth-of-type(2) {
        object-position: 100% center;
      }

        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 35%, rgba(11, 31, 63, 0.84));
      }

      .cover-title {
        position: absolute;
        z-index: 1;
        left: 18px;
        right: 18px;
        bottom: 14px;
        color: #ffffff;
      }

      .cover-title p {
        margin: 0 0 2px;
        font-size: 0.72rem;
        font-weight: 900;
      }

      .cover-title h1 {
        margin: 0;
        font-size: clamp(1.7rem, 8vw, 2.25rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

        border: 1px solid rgba(8, 121, 189, 0.16);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 9px 24px rgba(47, 67, 104, 0.09);

        display: block;
        color: #12355a;
        font-size: 1.05rem;
      }

        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 700;
        line-height: 1.65;
      }

      .tabs {

        top: 8px;
        z-index: 10;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-top: 12px;
        padding: 6px;
        border: 1px solid rgba(18, 84, 137, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 8px 22px rgba(19, 57, 96, 0.12);
        backdrop-filter: blur(12px);

        border: 0;
        border-radius: 6px;
        color: #31536e;
        background: transparent;
        font-weight: 900;
      }

      .tab-btn.active[data-story="story1"] {

        background: linear-gradient(180deg, #1599ec, #006dbb);
      }

      .tab-btn.active[data-story="story2"] {

        background: linear-gradient(180deg, #e64989, #bd2868);

        background: #f6fafc;

        font-size: 0.82rem;
        font-weight: 700;

        content: "+";

        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;

        margin: 22px 0 0;
        color: var(--muted);
        text-align: center;
        font-size: 0.84rem;
        font-weight: 800;
      }
    </style>
  </head>

          timings: [[0,1.58],[2.08,2.84],[3.42,5.36],[5.9,6.98],[7.64,9.18],[9.56,12.82],[13.7,15.5],[15.96,17.54],[17.82,19.9],[20.56,22.42],[23.04,24.58],[25.32,27.18],[27.68,30.62],[31.54,33.28],[33.8,34.68],[35.44,36.72],[37.2,39.4],[40.36,42.64],[43.8,46.52],[47.96,50.32],[51.18,52.46],[53.14,54.44],[54.24,56.76],[57.48,59.04],[59.6,60.6],[60.92,62.54],[63.18,63.78],[64.44,66.16],[66.96,68.46],[69.02,71.08]],

      const functionWords = new Set([
        "a", "am", "an", "and", "are", "as", "at", "be", "from", "has", "have", "his",
        "i", "in", "is", "it", "my", "of", "on", "our", "she", "that", "the", "their",

        youngest: [0, 5],

      const vowel = /^[aeiou]/i;
      const vowelEnd = /[aeiouy]$/i;

      function cleanWord(word) {
        return word.toLowerCase().replace(/[^a-z’']/g, "");
      }

      function shouldLink(left, right) {
        const a = cleanWord(left);
        const b = cleanWord(right);
        if (!a || !b) return false;
        return vowel.test(b) || (vowelEnd.test(a) && vowel.test(b));
      }

      function renderStressedWord(word, sentence) {
        const cleaned = cleanWord(word);
        const base = cleaned.replace(/[’']s$/, "");
        const forceStress = base === "have"
          && (
            sentence === "They have fun."
            || sentence === "We have a garage, and we park our car in the garage."
          );
        if (!forceStress && (functionWords.has(cleaned) || functionWords.has(base))) return word;
        const range = stressedSyllables[base] || [0, base.length];
        const possessiveLength = cleaned.length - base.length;
        const end = Math.min(range[1], word.length - possessiveLength);
        return `${word.slice(0, range[0])}<span class="stress-word">${word.slice(range[0], end)}</span>${word.slice(end)}`;
      }

      function renderPracticeText(sentence) {
        const parts = sentence.match(/[A-Za-z]+(?:[’'][A-Za-z]+)?|[^A-Za-z]+/g) || [sentence];
        const wordIndexes = parts.map((part, index) => (/^[A-Za-z]/.test(part) ? index : -1)).filter((index) => index >= 0);
        return parts.map((part, index) => {
          if (!/^[A-Za-z]/.test(part)) {
            const previousWordIndex = [...wordIndexes].reverse().find((item) => item < index);
            const nextWordIndex = wordIndexes.find((item) => item > index);
            const isSpace = /^\s+$/.test(part);
            const skipLink = previousWordIndex !== undefined
              && nextWordIndex !== undefined
              && (
                (sentence === "I live in Portugal."
                  && cleanWord(parts[previousWordIndex]) === "live"
                  && cleanWord(parts[nextWordIndex]) === "in")
                || (sentence === "I live in a big house."
                  && cleanWord(parts[previousWordIndex]) === "live"
                  && cleanWord(parts[nextWordIndex]) === "in")
                || (sentence === "Portugal is in Europe, next to Spain."
                  && cleanWord(parts[previousWordIndex]) === "portugal"
                  && cleanWord(parts[nextWordIndex]) === "is")
                || (sentence === "It is yellow and white."
                  && cleanWord(parts[previousWordIndex]) === "yellow"
                  && cleanWord(parts[nextWordIndex]) === "and")
                || (sentence === "There is also an avocado tree."
                  && (
                    (cleanWord(parts[previousWordIndex]) === "also"
                      && cleanWord(parts[nextWordIndex]) === "an")
                    || (cleanWord(parts[previousWordIndex]) === "an"
                      && cleanWord(parts[nextWordIndex]) === "avocado")
                  ))
                || (sentence === "I like to eat the fruit from the trees."
                  && cleanWord(parts[previousWordIndex]) === "to"
                  && cleanWord(parts[nextWordIndex]) === "eat")
              );
            if (isSpace && !skipLink && previousWordIndex !== undefined && nextWordIndex !== undefined && shouldLink(parts[previousWordIndex], parts[nextWordIndex])) {
              return '<span class="link-mark" aria-label="link">‿</span>';
            }
            return part;
          }
          return renderStressedWord(part, sentence);
        }).join("");
      }

      function buildPanel(key) {
        const story = stories[key];
        const panel = document.querySelector(`#${key}Panel`);
        panel.innerHTML = `
          <div class="player-panel">
            <div class="story-heading">
              <div><p>${story.eyebrow}</p><h2>${story.title}</h2></div>
              <span class="duration">${story.duration}</span>
            </div>
            <div class="audio-tools">
              <audio class="main-audio" controls preload="metadata" src="${story.audio}"></audio>
              <div class="speed-buttons" aria-label="再生速度">
                <button class="speed-btn" type="button" data-rate="0.5">0.5x</button>
                <button class="speed-btn" type="button" data-rate="0.75">0.75x</button>
                <button class="speed-btn active" type="button" data-rate="1">1.0x</button>
              </div>
            </div>
          </div>
          <div class="section-heading">
            <h3>Sentence Practice</h3>
            <span class="counter">${story.sentences.length} sentences</span>
          </div>
          <div class="practice-guide">
            <p>Rhythm を押すと内容語（の強勢音節）が青く目立ちます。</p>
            <p>Linking を押すとリンキングの目安が表示されます。</p>
          </div>
          <div class="cue-toolbar" aria-label="発音ヒントの表示切り替え">
            <button class="cue-toggle active" type="button" data-cue="rhythm" aria-pressed="true">Rhythm</button>
            <button class="cue-toggle active" type="button" data-cue="linking" aria-pressed="true">Linking</button>
          </div>
          <div class="sentence-list"></div>
        `;

        const list = panel.querySelector(".sentence-list");
        story.sentences.forEach((sentence, index) => {
          const card = document.createElement("article");
          card.className = "sentence-card";
          card.innerHTML = `
            <div class="sentence-copy">
              <span class="sentence-number">${String(index + 1).padStart(2, "0")}</span>
              <p class="practice-text">${renderPracticeText(sentence)}</p>
              <div class="audio-tools sentence-player">
                <audio class="sentence-audio" controls preload="metadata" src="./audio/review/${key}/${String(index + 1).padStart(2, "0")}.mp3" aria-label="文${index + 1}の音声"></audio>
                <div class="speed-buttons" aria-label="文${index + 1}の再生速度">
                  <button class="speed-btn" type="button" data-rate="0.5">0.5x</button>
                  <button class="speed-btn" type="button" data-rate="0.75">0.75x</button>
                  <button class="speed-btn active" type="button" data-rate="1">1.0x</button>
                </div>
              </div>
              <details class="ipa-panel">
                <summary>発音記号を表示する</summary>
                <p class="ipa-text">${story.ipas[index]}</p>
              </details>
            </div>
          `;
          list.appendChild(card);
        });
      }

      buildPanel("story1");
      buildPanel("story2");

      document.addEventListener("click", (event) => {
        const tab = event.target.closest(".tab-btn");
        if (tab) {
          document.querySelectorAll("audio").forEach((audio) => audio.pause());
          document.querySelectorAll(".tab-btn").forEach((button) => {
            const active = button === tab;
            button.classList.toggle("active", active);
            button.setAttribute("aria-selected", String(active));
          });
          document.querySelectorAll(".story-panel").forEach((panel) => {
            panel.hidden = panel.dataset.story !== tab.dataset.story;
          });
          window.scrollTo({ top: document.querySelector(".tabs").offsetTop - 8, behavior: "smooth" });
          return;
        }

        const speed = event.target.closest(".speed-btn");
        if (speed) {
          const tools = speed.closest(".audio-tools");
          tools.querySelector("audio").playbackRate = Number(speed.dataset.rate);
          tools.querySelectorAll(".speed-btn").forEach((button) => button.classList.toggle("active", button === speed));
          return;
        }

        const cue = event.target.closest(".cue-toggle");
        if (cue) {
          const panel = cue.closest(".story-panel");
          const active = !cue.classList.contains("active");
          cue.classList.toggle("active", active);
          cue.setAttribute("aria-pressed", String(active));
          panel.classList.toggle(`hide-${cue.dataset.cue}`, !active);
          return;
        }

      });

      document.addEventListener("play", (event) => {
        if (event.target.tagName !== "AUDIO") return;
        document.querySelectorAll("audio").forEach((audio) => {
          if (audio !== event.target) audio.pause();
        });
      }, true);
    </script>
  </body>
</html>
